<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#451a03" />
    <title>Offline · Gur Admin</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at top, #451a03 0%, #1c0b02 55%, #0c0a09 100%);
        color: #fafaf9;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        border-radius: 20px;
        background: rgba(28, 25, 23, 0.88);
        border: 1px solid rgba(245, 158, 11, 0.22);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(245, 158, 11, 0.35);
      }
      .icon img {
        width: 100%;
        height: 100%;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.55;
        color: #d6d3d1;
      }
      button {
        appearance: none;
        border: none;
        width: 100%;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        color: #1c0b02;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.1s ease;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: #a8a29e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">
        <img src="/icons/admin-icon-192.png" alt="Gur Admin" />
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>
        Gur Admin requires a live internet connection to keep orders, courier shipments, and inventory in sync.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
      <div class="hint">Reconnect to Wi-Fi or mobile data and tap Try Again.</div>
    </main>
    <script>
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
